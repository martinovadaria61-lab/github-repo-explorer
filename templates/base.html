<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GitHub Repo Explorer{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8fa; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; }
    .card-repo:hover { box-shadow: 0 .25rem .75rem rgba(0,0,0,.1); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">GitHub Repo Explorer</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('index') }}">Пошук</a>
      <a class="nav-link" href="{{ url_for('saved') }}">Збережені</a>
      <a class="nav-link" href="{{ url_for('stats') }}">Статистика</a>
      <a class="nav-link" href="{{ url_for('history') }}">Історія</a>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
